name: Publish scheduled Instagram posts

on:
  schedule:
    # GitHub does not guarantee cron timing and drops runs from high-frequency schedules on quiet repos (on the
    # sister page a */15 fired once in seven hours). So runs are concentrated in the UTC hours around each slot,
    # covering both EST (UTC-5) and EDT (UTC-4), plus an hourly sweep. posts.json times mean "at or after".
    #   Slot ET   EST UTC   EDT UTC
    #   07:30     12:30     11:30     story
    #   08:00     13:00     12:00     carousel
    #   12:30     17:30     16:30     reel
    #   18:00     23:00     22:00     carousel
    #   21:00     02:00     01:00     reel
    # Recompute these windows whenever the slots change.
    - cron: "*/10 1-2,11-13,16-17,22-23 * * *"
    - cron: "7 * * * *"      # the hourly sweep: it waits inside the run for any post due before the next sweep
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: selftest
        options:
          - selftest        # create one image container, publish nothing
          - publish         # publish anything due
          - reel-selftest   # upload a Reel from a media/<slug> branch, publish nothing
          - insights        # record how recent posts did
      reel_branch:
        description: "reel-selftest: the media branch, e.g. media/2026-12-01-r1"
        required: false
        default: ""
      reel_file:
        description: "reel-selftest: the MP4 on that branch"
        required: false
        default: ""

permissions:
  contents: write           # write published ids back into posts.json, delete used media branches

concurrency:
  group: instagram-publish  # never let two runs publish the same post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Use the newest manifest
        # A run that waited in the concurrency queue was checked out at the commit that triggered it, which can be
        # older than the run that just published (21 Nov duplicate). Always publish from the tip of main.
        run: git pull --ff-only origin main && git log -1 --format='manifest at %h %s'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test (creates a container, posts nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'selftest'
        run: python publish.py --selftest

      - name: Reel self-test (posts nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reel-selftest'
        env:
          REEL_BRANCH: ${{ inputs.reel_branch }}
          REEL_FILE: ${{ inputs.reel_file }}
        run: python publish.py --reel-selftest "$REEL_BRANCH" "$REEL_FILE"

      - name: Record performance
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'insights'
        run: python publish.py --insights

      - name: Publish anything due
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # up to 3 rounds: e.g. the 07:30 Story and the 08:00 carousel both go out on time from one hourly run
            for round in 1 2 3; do python publish.py --wait 62 || exit 1; done
          else
            python publish.py
          fi

      - name: Record what was published
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'publish' || inputs.mode == 'insights')
        run: |
          files=$(ls posts.json docs/daily/performance.json docs/daily/performance.md 2>/dev/null)
          if [ -n "$(git status --porcelain -- $files)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $files
            git commit -m "Record published posts [skip ci]"
            # the daily content run pushes to main too: rebase on it rather than fail
            python publish.py --export-records /tmp/records.json
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -q; then git push && ok=1 && break; fi
              # conflict: start again from the newest main and re-apply this run's records (ids are never dropped)
              git rebase --abort 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main
              python publish.py --apply-records /tmp/records.json
              git add -- $files && git commit -qm "Record published posts [skip ci]" || true
              git push && ok=1 && break
              sleep 5
            done
            if [ "$ok" != 1 ]; then echo "::error::published ids could NOT be recorded on main"; exit 1; fi
          else
            echo "No manifest changes."
          fi
